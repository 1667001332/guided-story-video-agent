[project]
name = "guided-story-video-agent"
version = "0.3.0"
description = "A low-pressure idea garden that turns one direction into selectable story cards, a timed script, and video."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
web = ["gradio>=4.44,<6"]
narration = ["edge-tts>=7,<8"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
guided-story-web = "guided_story_agent.web_app:main"
guided-story-selfplay = "guided_story_agent.selfplay:main"
guided-story-cli = "guided_story_agent.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["guided_story_agent*"]
exclude = ["tests*", "scripts*", "outputs*"]
