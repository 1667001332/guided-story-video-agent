[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-story-video-agent"
version = "1.0.1"
description = "A low-pressure idea garden that turns one direction into a confirmed story, an adaptive script, and video."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
web = ["gradio>=4.44,<6"]
narration = ["edge-tts>=7,<8"]
dev = ["build>=1,<2", "pytest>=8,<9", "ruff==0.15.22"]

[project.scripts]
guided-story-web = "guided_story_agent.web_app:main"
guided-story-selfplay = "guided_story_agent.selfplay:main"
guided-story-batch = "guided_story_agent.batch_test:main"
guided-story-cli = "guided_story_agent.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["guided_story_agent*"]
exclude = ["tests*", "scripts*", "outputs*"]

[tool.setuptools.package-data]
guided_story_agent = [
  "prompts/*.md",
  "prompts/v2/director/*.md",
  "resources/*.jsonl",
]
