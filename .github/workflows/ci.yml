name: offline-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install offline test dependencies
        run: python -m pip install -e ".[web,narration,dev]"
      - name: Unit and UI handler tests
        run: python -m unittest discover -s tests -v
        env:
          AGNES_API_KEY: ""
          TEXT_API_KEY: ""
          VIDEO_API_KEY: ""
      - name: Compile
        run: python -m compileall -q guided_story_agent scripts tests
      - name: Lint
        run: python -m ruff check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build wheel and source distribution
        run: |
          python -m pip install "build>=1,<2"
          python -m build
      - name: Install the wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify installed resources and entry points outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/verify_installed_package.py"
      - name: Verify FFmpeg is available for final assembly
        run: ffmpeg -version
